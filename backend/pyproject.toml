[project]
name = "backend"
version = "0.1.0"
description = "CodeVoyager API service"
readme = "README.md"
authors = [
    { name = "jilleenqmehffa-dot", email = "jilleenqmehffa@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["../tests/backend"]
pythonpath = [".", ".."]

[project.scripts]
backend = "app.main:run"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
